# Monorepo-level pyproject.toml
# Individual packages have their own pyproject.toml in packages/*/
#
# This file provides shared tool configuration (ruff, pytest)
# that applies across all packages.

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.pyx", "*.ipynb"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "SIM108", # use ternary operator instead of if-else
]

[tool.ruff.lint.per-file-ignores]
"all.py" = ["F401"]
"__init__.py" = ["F401"]
