[metadata]
name = hilbert_maass
version = attr: hilbert_maass.__version__
author = Fredrik Stromberg
author_email = fredrik314@gmail.com
url = https://github.com/fredstro/hilbert-maass
description = Algorithms for Hilbert Maass forms
long_description = file: README.md
long_description_content_type = text/markdown
license = GPL v3+
license_file = LICENSE
platform = any
keywords = "hilbert modular forms, maass waveforms"
classifiers =
      Development Status :: 4 - Beta
      Intended Audience :: Science/Research
      License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)
      Operating System :: OS Independent
      Programming Language :: C
      Programming Language :: C++
      Programming Language :: Python
      Programming Language :: Cython
      Topic :: Scientific/Engineering :: Mathematics
project_urls =
    Bug Tracker = https://github.com/fredstro/hilbert_maass/issues
    Source Code = https://github.com/fredstro/hilbert_maass/

[options]
use_scm_version = True
packages = hilbert_maass
package_dir=
    hilbert_maass=src/hilbert_maass
[sdist]
formats = gztar
