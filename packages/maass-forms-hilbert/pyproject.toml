[build-system]
requires = [
    "setuptools>=82.0.1",
    "cython>=3.1.0,<3.3.0",
    "setuptools_scm[toml]>=6.2"
]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
root = "../.."
git_describe_command = "git describe --dirty --tags --long --match hilbert/v*"
tag_regex = "^hilbert/v(?P<version>.+)$"
local_scheme = "no-local-version"
fallback_version = "0.0.0"

[tool.pytest.ini_options]
pythonpath = [
    "src",
    "."
    ]
addopts = [
    "--import-mode=importlib",
]

[project]
name = "maass_forms_hilbert"
authors = [
    {name = "Fredrik Stromberg", email = "fredrik314@gmail.com"},
    {name = "Sujeet Singh", email = "sujeet170492@gmail.com"}
    ]
description = "Algorithms for Hilbert Maass forms"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["hilbert maass forms", "maass forms"]
classifiers = [
      "Development Status :: 4 - Beta",
      "Intended Audience :: Science/Research",
      "Operating System :: OS Independent",
      "Programming Language :: C",
      "Programming Language :: C++",
      "Programming Language :: Python",
      "Programming Language :: Cython",
      "Topic :: Scientific/Engineering :: Mathematics"
    ]
readme = {file = "README.md", content-type = "text/markdown"}
dynamic = ["version"]
dependencies = [
    "maass_form_core",
    "hilbert_modular_group >= 0.2.1",
    ]
[project.optional-dependencies]
dev = [
    "tox",
    "mongomock",
    "freezegun",
    "ruff",
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "pre-commit",
]
[project.urls]
homepage = "https://github.com/fredstro/maass_forms_hilbert"
bugtracker = "https://github.com/fredstro/maass_forms_hilbert/issues"
sourcecode = "https://github.com/fredstro/maass_forms_hilbert/"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src"]
extend-exclude = ["*.pyx", "*.ipynb"]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "SIM108", # use ternary operator instead of if-else
    "UP047",  # prefer PEP 695 type parameters (not required for this codebase)
]
#ignore = [
#    "A001", "A002", "A004", # Allow shadowing builtins
#    "N801", "N806", "N803", "N802", # some variable names are not valid, according to PEP8, but are mathematically logical.
#    "E501", # Ignore long lines since it is hard to avoid in doctests.
#    "RUF013" # Allow Implicit optionals
#    ]

[tool.ruff.lint.per-file-ignores]
"all.py" = [
  "F401", # Unused import - these files are by definition collections of imports.
]
"__init__.py" = [
  "F401", # Unused import
]