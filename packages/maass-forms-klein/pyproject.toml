[build-system]
requires = [
    "setuptools>=82.0.1",
    "cython>=3.1.0,<3.3.0",
    "setuptools_scm[toml]>=6.2",
]
build-backend = "setuptools.build_meta"

[project]
name = "maass_forms_klein"
dynamic = ["version"]
description = "Algorithms for Kleinian Maass forms on hyperbolic 3-manifolds"
authors = [
    { name = "Fredrik Stromberg", email = "fredrik314@gmail.com" }
]
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">= 3.11"
keywords = ["kleinian groups", "maass forms", "hyperbolic 3-manifolds"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: C",
    "Programming Language :: Python",
    "Programming Language :: Cython",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "maass_form_core",
    "pythran",
    "snappy",
    "snappy-manifolds",
    "jupyter"
]
[project.optional-dependencies]
dev = [
    "build",
    "tox",
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "mongomock",
    "freezegun",
    "ruff",
    "pre-commit",
]
notebook = [
    "jupyter"
]
[project.urls]
repository = "https://github.com/fredstro/maass_forms_klein"
homepage = "https://github.com/fredstro/maass_forms_klein"
"bug tracker" = "https://github.com/fredstro/maass_forms_klein/issues"


[tool.setuptools_scm]
root = "../.."
git_describe_command = "git describe --dirty --tags --long --match klein/v*"
tag_regex = "^klein/v(?P<version>.+)$"
local_scheme = "no-local-version"
fallback_version = "0.0.0"

[tool.setuptools.package-data]
maass_forms_klein = ["src/maass_forms_klein/openapi/*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100
target-version = "py313"
fix = true
unsafe-fixes = false
extend-exclude = [".virtual_documents", ".ipynb_checkpoints"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint]
select = ["E", "F", "W", "N", "B", "A", "C", "T", "Q", "RUF"]
# Ignore the rules for shadowing builtins since we follow mongoengine naming conventions
# and use 'id' for the unique id.
# Also ignore PEP8 naming rules for mathematical variable conventions (matching maass-forms-hilbert).
ignore = [
    "A001", "A002", # Allow shadowing builtins
    "N801", "N806", "N803", "N802", # Allow mathematical variable names
]
[tool.ruff.lint.per-file-ignores]
# Complex mathematical algorithms that are inherently high-complexity
"**/parallelogram.py" = ["C901"]
"**/utils.py" = ["C901"]
"**/compute_coefficients.py" = ["C901"]
"**/kleinian_group.py" = ["C901"]
"all.py" = [
    "F401", # Unused import - these files are by definition collections of imports.
]