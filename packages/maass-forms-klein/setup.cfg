[metadata]
name = maass_forms_klein
author = Fredrik Stromberg
author_email = fredrik314@gmail.com
url = https://github.com/fredstro/maass-forms-klein
description = Algorithms for Maass forms on knot complements
long_description = file: README.md
long_description_content_type = text/markdown
license = GPL v3+
license_files = LICENSE
platform = any
keywords = "knots, maass waveforms"
classifiers =
      Development Status :: 4 - Beta
      Intended Audience :: Science/Research
      License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)
      Operating System :: OS Independent
      Programming Language :: C
      Programming Language :: C++
      Programming Language :: Python
      Programming Language :: Cython
      Topic :: Scientific/Engineering :: Mathematics
project_urls =
    Bug Tracker = https://github.com/fredstro/maass_forms_klein/issues
    Source Code = https://github.com/fredstro/maass_forms_klein/

[options]
use_scm_version = True
packages = maass_forms_klein
package_dir =
    maass_forms_klein=src/maass_forms_klein

[sdist]
formats = gztar
